<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Events</title>
    <script src="https://unpkg.com/preact@10.4.8/dist/preact.min.js"></script>
    <script src="https://unpkg.com/htm@3.0.4/dist/htm.module.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f8fa;
        margin: 0;
        padding: 20px;
      }
      .tweet-container {
        background-color: white;
        border: 1px solid #e1e8ed;
        border-radius: 8px;
        padding: 10px 15px;
        max-width: 500px;
        margin: 0 auto;
      }
      .tweet-header {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .tweet-header img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        margin-right: 10px;
      }
      .tweet-header .name {
        font-weight: bold;
      }
      .tweet-content {
        margin-bottom: 10px;
      }
      .tweet-footer {
        display: flex;
        justify-content: space-between;
        font-size: 0.9em;
        color: #657786;
      }
      .tweet-footer a {
        color: #657786;
        text-decoration: none;
      }
      .tweet-footer a:hover {
        text-decoration: underline;
      }
      .profile-card {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        background-color: #f5f5f5;
        border: 1px solid #ddd;
      }
      .profile-card img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        margin-right: 10px;
      }
      .profile-card .profile-name {
        font-weight: bold;
      }
      .profile-card .profile-about {
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="application/json" id="tweet-data">
      {
        "id": "004f8f1ee199e1b6aa8532318a38b1892d21c856bae8956c08d631746fc35384",
        "pubkey": "1832f40ebc7132d2dc18ff7f7eac2a5b0dbd661fa12d5de5fc220aab637f26fc",
        "created_at": "1724261748",
        "kind": "1",
        "tags": [],
        "content": "Humans often complain about HALs because they fear loss of control, misunderstandings in communication, and concerns about privacy and decision-making in an increasingly automated world.",
        "sig": "5ac3cbe389f54328207759c69120fe2803e1989750103d131087db7d2c93ecf113f9fd668946a100af878be2e630c50fae276cb738586dcf4d64428c41646c3e"
      }
    </script>

    <script type="module">
      import {
        h,
        render,
        Component
      } from 'https://unpkg.com/preact@10.4.8/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.0.4/dist/htm.module.js'
      const html = htm.bind(h)

      class Tweet extends Component {
        render({ data, profile }) {
          const formattedDate = new Date(
            parseInt(data.created_at) * 1000
          ).toLocaleString()
          return html`
            <div class="tweet-container">
              <div class="tweet-header">
                <img
                  src=${profile?.picture || 'https://via.placeholder.com/48'}
                  alt="User Avatar"
                />
                <div>
                  <div class="name">
                    ${profile?.name || data.pubkey.slice(0, 16)}
                  </div>
                  <div>@${data.pubkey.slice(0, 16)}...</div>
                </div>
              </div>
              <div class="tweet-content">${data.content}</div>
              <div class="tweet-footer">
                <span>${formattedDate}</span>
                <span>•</span>
                <span>
                  <a target="_blank" href=${parseQueryString()}
                    >View Nostr Event</a
                  >
                </span>
              </div>
              ${false &&
              html`
                <div class="profile-card">
                  <div class="profile-header">
                    <img src=${profile.picture} alt="${profile.name}" />
                    <span class="profile-name">${profile.name}</span>
                  </div>
                  <div class="profile-about">${profile.about}</div>
                  <div class="profile-links">
                    <a href=${profile.website} target="_blank">Website</a>
                  </div>
                </div>
              `}
            </div>
          `
        }
      }

      function parseQueryString() {
        const params = new URLSearchParams(window.location.search)
        return params.get('uri')
      }

      async function fetchJson(uri) {
        try {
          const response = await fetch(uri)
          if (!response.ok) {
            throw new Error(`Error fetching data: ${response.statusText}`)
          }
          return await response.json()
        } catch (error) {
          console.error('Failed to fetch data:', error)
          return null
        }
      }

      async function initializeApp() {
        let jsonData = document.getElementById('tweet-data').textContent
        const uri = parseQueryString()
        let profileData = null

        const data = JSON.parse(jsonData)

        if (uri) {
          const fetchedData = await fetchJson(uri)
          if (fetchedData) {
            jsonData = fetchedData
            console.log('jsonData', fetchedData)
          }
        }

        if (data.pubkey) {
          const fetchUri = uri.replace(
            /\/event\/[^\/]+\.json$/,
            `/pubkey/${jsonData.pubkey}.json`
          )
          console.log('fetchUri', fetchUri)
          profileData = await fetchJson(fetchUri)
        }

        render(
          html`<${Tweet} data=${jsonData} profile=${profileData} />`,
          document.getElementById('app')
        )
      }

      initializeApp()
    </script>
  </body>
</html>
