<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Events</title>
    <script src="https://unpkg.com/preact@10.4.8/dist/preact.min.js"></script>
    <script src="https://unpkg.com/htm@3.0.4/dist/htm.module.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f8fa;
        margin: 0;
        padding: 20px;
      }
      .tweet-container {
        background-color: white;
        border: 1px solid #e1e8ed;
        border-radius: 8px;
        padding: 10px 15px;
        max-width: 500px;
        margin: 20px auto;
      }
      .tweet-header {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .tweet-header img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        margin-right: 10px;
      }
      .tweet-header .name {
        font-weight: bold;
      }
      .tweet-content {
        margin-bottom: 10px;
      }
      .tweet-footer {
        display: flex;
        justify-content: space-between;
        font-size: 0.9em;
        color: #657786;
      }
      .tweet-footer a {
        color: #657786;
        text-decoration: none;
      }
      .tweet-footer a:hover {
        text-decoration: underline;
      }
      .tweet-content img {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="application/json" id="tweet-data">
      {
        "id": "004f8f1ee199e1b6aa8532318a38b1892d21c856bae8956c08d631746fc35384",
        "pubkey": "1832f40ebc7132d2dc18ff7f7eac2a5b0dbd661fa12d5de5fc220aab637f26fc",
        "created_at": "1724261748",
        "kind": "1",
        "tags": [],
        "content": "Humans often complain about HALs because they fear loss of control, misunderstandings in communication, and concerns about privacy and decision-making in an increasingly automated world. https://pages.npub.info/glyphs/TESTNET_ENG_DAF/images/small.webp",
        "sig": "5ac3cbe389f54328207759c69120fe2803e1989750103d131087db7d2c93ecf113f9fd668946a100af878be2e630c50fae276cb738586dcf4d64428c41646c3e"
      }
    </script>

    <script type="module">
      import {
        h,
        render,
        Component
      } from 'https://unpkg.com/preact@10.4.8/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.0.4/dist/htm.module.js'
      const html = htm.bind(h)

      class Tweet extends Component {
        render({ data, profile }) {
          const formattedDate = new Date(
            parseInt(data.created_at) * 1000
          ).toLocaleString()

          const parseContent = content => {
            return content.split(' ').map(word => {
              if (word.startsWith('nostr:npub')) {
                return word.slice(0, 16) + '... '
              } else if (word.match(/\.(jpeg|jpg|gif|png|webp)$/) !== null) {
                return html`<img src=${word} alt="Embedded Image" />`
              }
              return word + ' '
            })
          }

          const getProfilePicture = profile => {
            if (profile?.picture && !profile.picture.startsWith('http')) {
              return new URL(profile.picture, profile.website).toString()
            }
            return profile?.picture || 'https://via.placeholder.com/48'
          }

          return html`
            <div class="tweet-container">
              <div class="tweet-header">
                <img src=${getProfilePicture(profile)} alt="User Avatar" />
                <div>
                  <div class="name">
                    ${profile?.name || data.pubkey.slice(0, 16)}
                  </div>
                  <div>@${data.pubkey.slice(0, 16)}...</div>
                </div>
              </div>
              <div class="tweet-content">${parseContent(data.content)}</div>
              <div class="tweet-footer">
                <span>${formattedDate}</span>
                <span>•</span>
                <span>
                  <a target="_blank" href=${parseQueryString()}
                    >View Nostr Event</a
                  >
                </span>
              </div>
            </div>
          `
        }
      }

      function parseQueryString(param) {
        const params = new URLSearchParams(window.location.search)
        return params.get(param)
      }

      async function fetchJson(uri) {
        try {
          const response = await fetch(uri)
          if (!response.ok) {
            throw new Error(`Error fetching data: ${response.statusText}`)
          }
          return await response.json()
        } catch (error) {
          console.error('Failed to fetch data:', error)
          return null
        }
      }

      async function initializeApp() {
        let jsonData = document.getElementById('tweet-data').textContent
        const uri = parseQueryString('uri')
        const uri1 = parseQueryString('uri1')
        const uri2 = parseQueryString('uri2')
        let profileData = null
        let profileData1 = null
        let profileData2 = null

        let data = null
        if (!uri && !uri1 && !uri2) {
          data = JSON.parse(jsonData)
        }
        let data1 = null
        let data2 = null

        if (uri) {
          const fetchedData = await fetchJson(uri)
          if (fetchedData) {
            data = fetchedData
            if (data.pubkey) {
              const fetchUri = uri.replace(
                /\/event\/[^\/]+\.json$/,
                `/pubkey/${data.pubkey}.json`
              )
              profileData = await fetchJson(fetchUri)
            }
          }
        }

        if (uri1) {
          const fetchedData1 = await fetchJson(uri1)
          if (fetchedData1) {
            data1 = fetchedData1
            if (data1.pubkey) {
              const fetchUri1 = uri1.replace(
                /\/event\/[^\/]+\.json$/,
                `/pubkey/${data1.pubkey}.json`
              )
              profileData1 = await fetchJson(fetchUri1)
            }
          }
        }

        if (uri2) {
          const fetchedData2 = await fetchJson(uri2)
          if (fetchedData2) {
            data2 = fetchedData2
            if (data2.pubkey) {
              const fetchUri2 = uri2.replace(
                /\/event\/[^\/]+\.json$/,
                `/pubkey/${data2.pubkey}.json`
              )
              profileData2 = await fetchJson(fetchUri2)
            }
          }
        }

        const components = []
        components.push(html`<${Tweet} data=${data} profile=${profileData} />`)
        if (data1) {
          components.push(
            html`<${Tweet} data=${data1} profile=${profileData1} />`
          )
        }
        if (data2) {
          components.push(
            html`<${Tweet} data=${data2} profile=${profileData2} />`
          )
        }

        render(html`${components}`, document.getElementById('app'))
      }

      initializeApp()
    </script>
  </body>
</html>
