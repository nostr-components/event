<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nc-event - Simple Example</title>
  <script type="module" src="../lib/nc-event.js"></script>
</head>
<body>
  <h1>Simple nc-event Usage</h1>

  <h2>Image</h2>
  <nc-event content="Check out this image! https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/280px-PNG_transparency_demonstration_1.png"></nc-event>

  <h2>YouTube</h2>
  <nc-event content="Watch this video https://youtu.be/dQw4w9WgXcQ"></nc-event>

  <h2>Multiple Media</h2>
  <nc-event
    content="Here's a GIF https://upload.wikimedia.org/wikipedia/commons/2/2c/Rotating_earth_%28large%29.gif and a video https://www.w3schools.com/html/mov_bbb.mp4"
    pubkey="82341f882b6eabcd2ba7f1ef90aad961cf074af15b9ef44a09f9d2a8fbfbe6a2"
  ></nc-event>
</body>
</html>
